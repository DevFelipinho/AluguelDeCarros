# Configuracoes do BD PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=12345

# Hibernate vai inserir comentarios no codigo SQL
spring.jpa.properties.hibernate.use_sql_comments=true
# Hibernate vai mostrar o SQL Formatado
spring.jpa.properties.hibernate.format_sql=true
# Fazer logging de queries lentas
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=10

spring.thymeleaf.cache=false

# O Spring vai ser capaz de receber os metodos PUT e DELETE
spring.mvc.hiddenmethod.filter.enabled=true
