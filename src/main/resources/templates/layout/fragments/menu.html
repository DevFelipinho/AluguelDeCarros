<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<div data-th-fragment="menu" class="space-y-4" th:fragment="menu" id="menu">

  <!-- 1o Item Menu: Carros -->
  <div x-data="{ open: true }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Carros', ~{::#carro-icon})}"></button>

    <!-- Opcoes do 1o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', @{/carros/novo}, ~{::#cadastrar-icon})}"></div>
      <!-- 2a Opcao -->
      <div th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', @{/carros}, ~{::#pesquisar-icon})}"></div>
    </div>
  </div>

  <!-- 2o Item Menu: Clientes -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Clientes', ~{::#cliente-icon})}"></button>

    <div x-show="open" class="space-y-4 ps-10">
      <div th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', @{/}, ~{::#cadastrar-icon})}"></div>
      <div th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', @{/}, ~{::#pesquisar-icon})}"></div>
    </div>
  </div>

  <!-- 3o Item Menu: Aluguéis -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Aluguéis', ~{::#aluguel-icon})}"></button>

    <div x-show="open" class="space-y-4 ps-10">
      <div th:replace="~{components/menu-item-option :: menu-item-option('Novo Aluguel', @{/}, ~{::#cadastrar-icon})}"></div>
      <div th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', @{/}, ~{::#pesquisar-icon})}"></div>
    </div>
  </div>

  <!-- SVGs auxiliares -->
  <div class="hidden">
    <!-- Icone Carro -->
    <svg id="carro-icon" class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1" />
    </svg>

    <!-- Icone Cliente -->
    <svg id="cliente-icon" class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
    </svg>

    <!-- Icone Aluguel -->
    <svg id="aluguel-icon" class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>

    <!-- Icone Cadastrar -->
    <svg id="cadastrar-icon" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>

    <!-- Icone Pesquisar -->
    <svg id="pesquisar-icon" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
  </div>

</div>
</html>
