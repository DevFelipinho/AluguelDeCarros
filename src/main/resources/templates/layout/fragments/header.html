<div th:fragment="header" xmlns:th="http://www.thymeleaf.org">
  <!-- Header -->
  <header class="flex items-center justify-between bg-gray-800 p-4">
    <!-- Botao Hamburger -->
    <div class="md:hidden">
      <button id="menu-btn" type="button" class="hamburger z-40 block focus:outline-none md:hidden">
        <span class="hamburger-top"></span>
        <span class="hamburger-middle"></span>
        <span class="hamburger-bottom"></span>
      </button>
    </div>

    <!-- Icone e nome sistema -->
    <a th:href="@{/}">
      <div class="flex items-center">
        <!-- Ícone de Carro -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-12 md:w-12 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
        </svg>
        <div class="text-xl font-semibold text-gray-400 md:text-3xl">Aluguel de Carros</div>
      </div>
    </a>

    <!-- Usuário e login/logout -->
    <div class="hidden items-center md:flex" th:fragment="usuariologinlogout" id="usuariologinlogout">
      <div class="text-sm text-gray-300 md:text-base">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-900 text-blue-200">
          Sistema Ativo
        </span>
      </div>
    </div>
  </header>
</div>
